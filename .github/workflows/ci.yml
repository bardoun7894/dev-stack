# Portable subset of dev-stack tests (no Mac, no ~/.claude, no servers).
# Submodules (vendor/*) stay off.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: boat
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest pyyaml
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - name: Python tests
        if: always()
        run: python -m pytest -q tests/test_*.py skills/boat/scripts/test_boat.py scripts/tests/cpu_budget_test.py scripts/tests/test_sync_rules_harnesses.py --ignore=tests/test_jdelegate_p6.py --ignore=tests/test_jdelegate_register.py --ignore=tests/test_tiers_proposed.py
      - name: Node tests
        if: always()
        run: node --test tests/jev_browse.test.mjs tests/jev_browse_ready.test.mjs tests/pr-review.test.mjs
      # These still run, but cannot pass on a clean VM: bin/jdelegate imports
      # ~/.pi/agent/extensions/model-router/route-body.mjs, and config/tiers.proposed.json
      # is not tracked in git. Shown as failed, does not block the PR.
      - name: Machine-bound tests (need ~/.pi and local config, allowed to fail)
        if: always()
        continue-on-error: true
        run: |
          python -m pytest -q tests/test_jdelegate_p6.py tests/test_jdelegate_register.py tests/test_tiers_proposed.py
          node --test tests/jdelegate.test.mjs
      - name: Shell tests
        if: always()
        run: |
          fail=0
          for t in tests/test_*.sh tests/branch-lock-test.sh scripts/gate/test_gate_run.sh scripts/gate/test_gate_status.sh; do
            if bash "$t" > /tmp/out.txt 2>&1; then echo "PASS $t"; else echo "FAIL $t"; tail -15 /tmp/out.txt; fail=1; fi
          done
          exit $fail
